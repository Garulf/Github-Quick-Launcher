body:
  - type: input
    attributes:
      name: username
      label: "GitHub username:"
      defaultValue: ""
      description: >
        Your GitHub username. With this set, typing "/" lists your public repositories and "*" lists your public stars. Not needed if you provide a token.
  - type: passwordBox
    attributes:
      name: token
      label: "Personal access token:"
      defaultValue: ""
      description: >
        Optional. Adds private and organization repositories and raises the GitHub API rate limit. A token with minimal scopes is enough; allow read:org to include organization repositories.
  - type: input
    attributes:
      name: cache_ttl_minutes
      label: "Cache lifetime (minutes):"
      defaultValue: "360"
      description: >
        How long your repository and star lists are reused before they are refreshed in the background. A filter that matches nothing, or a search that finds one of your repositories missing from the list, refreshes it early (at most once a minute, or once every ten minutes without a token).
  - type: checkbox
    attributes:
      name: online_search
      label: "Search all of GitHub as you type"
      defaultValue: "true"
      description: >
        When on, a query of three or more characters is also sent to GitHub's search API. Turn off to search only your cached repositories; nothing you type is sent to GitHub.
  - type: checkbox
    attributes:
      name: show_avatars
      label: "Show owner avatars"
      defaultValue: "true"
      description: >
        Loads a small owner avatar from GitHub for each result. Turn off to use the plugin icon and load no images.
